name: Checks
# Actions minutes are limited: CI runs the checks tier and the Pages build.
# Browser scenarios run locally (docs/development/TESTING.md), including the
# deployment-path smoke against the same build that scripts/deploy-pages.sh
# publishes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Complete history for the development ledger
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin "$GITHUB_SHA"
          fi
          test "$(git rev-parse --is-shallow-repository)" = "false"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm roadmap:check
      - run: pnpm test:rules
      - name: Build for GitHub Pages
        run: pnpm build
        env:
          VITE_BASE_PATH: /theandril-hearth-and-card/
